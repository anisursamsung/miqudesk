# ==============================================================================
# miqudesk Color Definitions
# ==============================================================================
# Define color variables using @name, $name, or CSS @define-color:
# These variables can be referenced in miqudesk.conf as @bg, @fg, @accent, etc.
# ==============================================================================

# Background for widgets (translucent dark glass)
@bg = #0f1422c8

# Primary foreground text color
@fg = #f2f6ff

# Muted secondary text color (dates, uptime, secondary labels)
@muted = #9bb0cc

# Accent color (seconds counter, pill badges, CPU meter)
@accent = #38bdf8

# Border outline color
@border = #ffffff26
