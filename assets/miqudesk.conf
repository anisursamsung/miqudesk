# ==============================================================================
# miqudesk Configuration File
# Interactive Desktop Canvas for Miquland
# ==============================================================================

# ==============================================================================
# Color Definitions Import (Optional)
# ==============================================================================
# Import dynamic color variables from the theme engine (or local colors.conf):
# include = ~/.config/theme/current/miqudesk.colors

# ==============================================================================
# Toolkit Appearance Overrides (Optional)
#
# By default, colors, fonts, and icon themes are inherited automatically
# from ~/.config/miqutoolkit/miqutoolkit.conf.
# You can uncomment and customize any setting below to override it for miqudesk:
# ==============================================================================
# font = Sans
# font_size = 11
# corner_radius = 20
# border_width = 1
# icon_theme = Papirus
#
# --- Custom Palette Overrides ---
# primary = #3584e4
# surface = #1e1e2e
# on_surface = #cdd6f4
# surface_variant = #313244
# on_surface_variant = #a6adc8
# outline = #45475a

[general]
# Canvas grid snapping step in pixels (set to 1 to disable snap)
grid_snap = 10

# Start directly in widget layout edit mode (true/false)
edit_mode = false

# ==============================================================================
# Typography & Colors
# ==============================================================================
# Font family used uniformly across desktop widgets and shortcut labels
font_family = Sans

# Base font size (scaled proportionally for headers and digital clock)
font_size = 11

# Font weight (set to true to enable bold text)
font_bold = false
shortcut_bold = false

# Color assignments using variables imported from colors.conf:
font_color = @fg
font_color_muted = @muted
accent_color = @accent

# ==============================================================================
# Uniform Widget Appearance (Glassmorphism)
# ==============================================================================
# Widget background and borders using imported variables:
widget_background = @bg
widget_border_color = @border
widget_border_width = 1

# Uniform corner rounding radius across all widget cards
widget_corner_radius = 20

# ==============================================================================
# Desktop App Shortcuts (.desktop files from ~/Desktop)
# ==============================================================================
[desktop]
# Max characters displayed for shortcut names before truncating with '…' (0 to disable)
desktop_max_chars = 14

# Shortcut card dimensions in pixels
shortcut_width = 84
shortcut_height = 92

# Target icon dimension in pixels
icon_size = 48

# Shortcut item background (set alpha or transparent #00000000)
shortcut_background = #00000000
shortcut_border_radius = 12

# Require double click to launch desktop shortcuts (true/false)
double_click = true

# Double click time threshold in milliseconds
double_click_time_ms = 400

# Grid placement of shortcut icons on the desktop
shortcuts_start_x = 480
shortcuts_start_y = 80
col_spacing = 96
row_spacing = 104
items_per_col = 5

# ==============================================================================
# Built-in Widgets
# ==============================================================================
# Clock is enabled and centered by default.
[clock]
enabled = true
format_24h = true
show_seconds = true
bold = false
x = 780
y = 460
width = 360
height = 145

[system]
enabled = false
x = 80
y = 245
width = 360
height = 135
